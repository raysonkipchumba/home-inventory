<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyApp</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- LOGIN -->
        <section id="loginScreen" class="screen">

            <div class="logo">
                MyApp
            </div>

            <div class="auth-card">

                <h1>Welcome back</h1>

                <p class="subtitle">
                    Sign in to continue
                </p>

                <form id="loginForm">

                    <div class="input-group">
                        <label for="loginUsername">
                            Username
                        </label>

                        <input
                            id="loginUsername"
                            type="text"
                            placeholder="Enter username"
                            autocomplete="username"
                            required
                        >
                    </div>


                    <div class="input-group">
                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            id="loginPassword"
                            type="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >
                    </div>


                    <button type="submit" class="primary-btn">
                        Sign in
                    </button>

                    <p id="loginError" class="error"></p>

                </form>


                <p class="switch-auth">
                    Don't have an account?
                    <button id="showRegister" class="link-btn">
                        Create one
                    </button>
                </p>

            </div>

        </section>


        <!-- REGISTER -->
        <section id="registerScreen" class="screen hidden">

            <div class="logo">
                MyApp
            </div>

            <div class="auth-card">

                <h1>Create account</h1>

                <p class="subtitle">
                    Join us today
                </p>


                <form id="registerForm">

                    <div class="input-group">

                        <label for="registerUsername">
                            Username
                        </label>

                        <input
                            id="registerUsername"
                            type="text"
                            placeholder="Choose a username"
                            autocomplete="username"
                            minlength="3"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <input
                            id="registerPassword"
                            type="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirm password
                        </label>

                        <input
                            id="confirmPassword"
                            type="password"
                            placeholder="Repeat your password"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        Create account
                    </button>

                    <p id="registerError" class="error"></p>

                </form>


                <p class="switch-auth">

                    Already have an account?

                    <button
                        id="showLogin"
                        class="link-btn"
                    >
                        Sign in
                    </button>

                </p>

            </div>

        </section>


        <!-- DASHBOARD -->
        <section id="dashboardScreen" class="screen hidden">

            <header class="topbar">

                <div class="logo">
                    MyApp
                </div>

                <button
                    id="logoutBtn"
                    class="logout-btn"
                >
                    Logout
                </button>

            </header>


            <div class="dashboard">

                <div class="welcome-card">

                    <p class="small-text">
                        Dashboard
                    </p>

                    <h1>
                        Welcome,
                        <span id="usernameDisplay"></span>
                    </h1>

                    <p>
                        Your account is ready.
                    </p>

                </div>


                <div class="stats">

                    <div class="stat-card">

                        <span class="stat-number">
                            0
                        </span>

                        <span class="stat-label">
                            Records
                        </span>

                    </div>


                    <div class="stat-card">

                        <span class="stat-number">
                            Active
                        </span>

                        <span class="stat-label">
                            Account
                        </span>

                    </div>

                </div>


                <div class="content-card">

                    <h2>
                        Your data
                    </h2>

                    <p>
                        Database records will appear here.
                    </p>

                    <div id="records">
                        No records yet.
                    </div>

                </div>

            </div>

        </section>

    </main>


    <script src="app.js"></script>

</body>
</html>
